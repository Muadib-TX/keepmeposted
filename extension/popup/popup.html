<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keep Me Posted</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>Keep Me Posted</h1>
      <div id="loading">Loading article analysis…</div>
      <section id="content" class="hidden">
        <div class="meta">
          <h2 id="title">Article</h2>
          <p id="publishDate"></p>
        </div>

        <section class="panel">
          <div class="panel-header">
            <h3>Freshness</h3>
            <button id="toggleAlertButton" type="button" class="secondary-button">
              Add alert
            </button>
          </div>
          <p id="freshnessStatus"></p>
          <p id="factDate"></p>
          <p id="freshnessExplanation"></p>
          <p id="alertStatus" class="muted"></p>
        </section>

        <section class="panel">
          <h3>Keep me posted</h3>
          <ul id="followUpsList"></ul>
        </section>

        <section class="panel">
          <h3>Reliability</h3>
          <p id="reliabilityScore"></p>
          <p id="reliabilityLabel"></p>
          <p id="domain"></p>
          <p id="ownerName"></p>
          <p id="ownerType"></p>
          <p id="ownerDescription"></p>
          <p id="reliabilityExplanation"></p>
        </section>

        <section class="panel">
          <h3>Topics</h3>
          <ul id="topicsList"></ul>
        </section>

        <button id="reportButton" type="button">Report incorrect</button>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
